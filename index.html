<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Face – GitHub Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Inter:wght@500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body data-theme="dark">
  <p class="logo">diana chin</p>
  <main class="page">
    <section class="demo">
      <button
        type="button"
        class="theme-toggle"
        data-node-id="28:52"
        role="switch"
        aria-checked="false"
        aria-label="Theme mode"
      >
        <span class="theme-toggle__knob" data-node-id="28:37">
          <span class="theme-toggle__label theme-toggle__label--dark" data-node-id="28:38">Dark</span>
          <span class="theme-toggle__label theme-toggle__label--light" data-node-id="29:72" aria-hidden="true">Light</span>
        </span>
      </button>

      <article
        class="watch-face"
        data-node-id="42:283"
        data-node-id-light="48:386"
        aria-label="Watch face"
      >
        <div class="watch-face__canvas">
          <div class="watch-face__watch" data-node-id="40:243" data-name="Watch-Dark">
            <img
              class="watch-face__background watch-face__theme-img"
              src="./assets/background-watch.svg"
              data-src-dark="./assets/background-watch.svg"
              data-src-light="./assets/light/background-watch.svg"
              alt=""
              width="364"
              height="364"
              data-node-id="40:242"
            />

            <div class="watch-face__dials" data-node-id="43:327">
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-6-12-a.png" data-src-dark="./assets/dials/dial-6-12-a.png" data-src-light="./assets/light/dials/dial-6-12-a.png" alt="" data-node-id="43:328" style="--x: 181.497px; --y: 345.999px; --w: 0.503px; --h: 8.001px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-6-12-a.png" data-src-dark="./assets/dials/dial-6-12-a.png" data-src-light="./assets/light/dials/dial-6-12-a.png" alt="" data-node-id="43:329" style="--x: 182px; --y: 345.999px; --w: 0.502px; --h: 8.001px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-7.png" data-src-dark="./assets/dials/dial-7.png" data-src-light="./assets/light/dials/dial-7.png" alt="" data-node-id="43:330" style="--x: 95.55px; --y: 323.82px; --w: 4.852px; --h: 7.413px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-5.png" data-src-dark="./assets/dials/dial-5.png" data-src-light="./assets/light/dials/dial-5.png" alt="" data-node-id="43:331" style="--x: 263.59px; --y: 323.82px; --w: 4.851px; --h: 7.413px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-8.png" data-src-dark="./assets/dials/dial-8.png" data-src-light="./assets/light/dials/dial-8.png" alt="" data-node-id="43:332" style="--x: 32.77px; --y: 263.59px; --w: 7.414px; --h: 4.851px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-4.png" data-src-dark="./assets/dials/dial-4.png" data-src-light="./assets/light/dials/dial-4.png" alt="" data-node-id="43:333" style="--x: 323.82px; --y: 263.59px; --w: 7.413px; --h: 4.851px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-9-3.png" data-src-dark="./assets/dials/dial-9-3.png" data-src-light="./assets/light/dials/dial-9-3.png" alt="" data-node-id="43:334" style="--x: 10px; --y: 181.5px; --w: 8.001px; --h: 1.005px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-9-3.png" data-src-dark="./assets/dials/dial-9-3.png" data-src-light="./assets/light/dials/dial-9-3.png" alt="" data-node-id="43:335" style="--x: 346px; --y: 181.5px; --w: 8.001px; --h: 1.005px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-10.png" data-src-dark="./assets/dials/dial-10.png" data-src-light="./assets/light/dials/dial-10.png" alt="" data-node-id="43:336" style="--x: 32.77px; --y: 95.55px; --w: 7.414px; --h: 4.852px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-2.png" data-src-dark="./assets/dials/dial-2.png" data-src-light="./assets/light/dials/dial-2.png" alt="" data-node-id="43:337" style="--x: 323.82px; --y: 95.55px; --w: 7.413px; --h: 4.852px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-11.png" data-src-dark="./assets/dials/dial-11.png" data-src-light="./assets/light/dials/dial-11.png" alt="" data-node-id="43:338" style="--x: 95.55px; --y: 32.77px; --w: 4.852px; --h: 7.414px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-1.png" data-src-dark="./assets/dials/dial-1.png" data-src-light="./assets/light/dials/dial-1.png" alt="" data-node-id="43:339" style="--x: 263.59px; --y: 32.77px; --w: 4.851px; --h: 7.414px;" />
              <img class="watch-face__tick watch-face__theme-img" src="./assets/dials/dial-12-top.png" data-src-dark="./assets/dials/dial-12-top.png" data-src-light="./assets/light/dials/dial-12-top.png" alt="" data-node-id="43:340" style="--x: 181.5px; --y: 10px; --w: 1.005px; --h: 8.001px;" />
            </div>
          </div>

          <img
            class="watch-hand watch-hand--hour watch-face__theme-img"
            src="./assets/hands/hour-hand.svg"
            data-src-dark="./assets/hands/hour-hand.svg"
            data-src-light="./assets/light/hands/hour-hand.svg"
            alt=""
            width="77"
            height="4"
            data-node-id="44:376"
          />

          <div class="watch-hand watch-hand--minute" data-node-id="44:374">
            <div class="watch-hand__rotate">
              <img
                class="watch-face__theme-img"
                src="./assets/hands/minute-hand.svg"
                data-src-dark="./assets/hands/minute-hand.svg"
                data-src-light="./assets/light/hands/minute-hand.svg"
                alt=""
                width="127"
                height="4"
              />
            </div>
          </div>

          <div class="watch-hand watch-hand--second" data-node-id="44:375">
            <div class="watch-hand__rotate watch-hand__rotate--second">
              <img
                class="watch-face__theme-img"
                src="./assets/hands/second-hand.svg"
                data-src-dark="./assets/hands/second-hand.svg"
                data-src-light="./assets/light/hands/second-hand.svg"
                alt=""
                width="101"
                height="1"
              />
            </div>
          </div>

          <img
            class="watch-face__center watch-face__theme-img"
            src="./assets/circle.svg"
            data-src-dark="./assets/circle.svg"
            data-src-light="./assets/light/circle.svg"
            alt=""
            width="4"
            height="4"
            data-node-id="44:373"
          />
        </div>
      </article>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
